version: '3.8'

services:
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      - FLASK_CONFIG=production
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - DATABASE_URL=sqlite:///prod.db
    volumes:
      - uploads:/app/app/static/uploads
      - db_data:/app/instance
    restart: unless-stopped

volumes:
  uploads:
  db_data:
